# Netlify configuration for AutoVerify Bot web panel
[build]
  publish = "web"
  command = "echo 'No build step required for static site'"

[build.environment]
  NODE_VERSION = "18"

# VERY IMPORTANT: Replace 'YOUR_BACKEND_URL' below with your REAL backend URL.
# Example: If your bot runs on a VPS at http://123.45.67.89:3000, use that URL.
# Example: If you use localtunnel/ngrok, use the tunnel URL (e.g. https://xxxx.loca.lt)
# Without this, ALL API calls will fail with 404 errors!
# After running `node bot.js`, the console will show your tunnel URL - use that.

[[redirects]]
  from = "/api/*"
  to = "YOUR_BACKEND_URL/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "YOUR_BACKEND_URL/uploads/:splat"
  status = 200
  force = true

# Redirect rules for SPA (Single Page Application) behavior
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for security and caching
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
