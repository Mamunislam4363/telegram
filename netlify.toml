# Netlify configuration for AutoVerify Bot web panel
[build]
  publish = "web"
  command = "echo 'No build step required for static site'"

[build.environment]
  NODE_VERSION = "18"

# VERY IMPORTANT: If your bot is running on a VPS or another server (like ngrok),
# you must replace 'YOUR_BACKEND_URL' with your real backend link (e.g., http://123.45.67.89:3000)
# Netlify will proxy all traffic to your backend API, saving you from needing an SSL certificate on the backend!

[[redirects]]
  from = "/api/*"
  to = "YOUR_BACKEND_URL/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "YOUR_BACKEND_URL/uploads/:splat"
  status = 200
  force = true

# Redirect rules for SPA (Single Page Application) behavior
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for security and caching
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
